<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Weather Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1>Weather Dashboard</h1>

    <form id="search-form" class="search">
      <label for="city-input" class="visually-hidden">City name</label>
      <input id="city-input" type="text" placeholder="Enter a city, e.g. Beirut" autocomplete="off" />
      <button type="submit" id="search-btn">Search</button>
    </form>

    <!-- Loading indicator -->
    <div id="loading" class="loading hidden" role="status" aria-live="polite">
      <div class="spinner"></div>
      <p>Loading weather...</p>
    </div>

    <!-- Error message -->
    <div id="error" class="error hidden" role="alert"></div>

    <!-- Weather result -->
    <section id="weather" class="weather hidden" aria-live="polite">
      <h2 id="city-name"></h2>
      <div class="main-info">
        <span id="weather-icon" class="icon" role="img" aria-label=""></span>
        <p id="temperature" class="temp"></p>
      </div>
      <p id="description" class="description"></p>

      <div class="details">
        <div class="detail"><span class="label">Feels like</span><span id="feels-like"></span></div>
        <div class="detail"><span class="label">Humidity</span><span id="humidity"></span></div>
        <div class="detail"><span class="label">Wind speed</span><span id="wind"></span></div>
        <div class="detail"><span class="label">Pressure</span><span id="pressure"></span></div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
